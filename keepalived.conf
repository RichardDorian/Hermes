global_defs {
    script_user root
    enable_script_security
}

vrrp_instance HERMES {
    interface $LAN_IF
    virtual_router_id $KEEPALIVED_VIRTUAL_ROUTER_ID
    advert_int 1

    virtual_ipaddress {
        $LAN_ADDRESS/24 dev $LAN_IF
        $WAN_ADDRESS/$WAN_PREFIX dev $WAN_IF
    }

    virtual_routes {
        default via $WAN_GATEWAY dev $WAN_IF
    }

    # Only run dnsmasq on the active node
    notify /etc/s6-overlay/scripts/keepalived-notify
}

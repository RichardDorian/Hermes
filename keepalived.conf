global_defs {
    script_user root
    enable_script_security
}

vrrp_instance HERMES {
    interface $LAN_IF
    virtual_router_id $KEEPALIVED_VIRTUAL_ROUTER_ID
    advert_int 1

    # Hold KEEPALIVED_VIP on a macvlan interface with the VRRP virtual MAC, so it
    # is the only address there (clients see it as the DHCP server identifier)
    # and its MAC does not change on failover
    use_vmac vrrp.$KEEPALIVED_VIRTUAL_ROUTER_ID
    vmac_xmit_base

    virtual_ipaddress {
        $KEEPALIVED_VIP/24
        $WAN_ADDRESS/$WAN_PREFIX dev $WAN_IF
    }

    virtual_routes {
        default via $WAN_GATEWAY dev $WAN_IF
    }

    # Only run dnsmasq on the active node
    notify /etc/s6-overlay/scripts/keepalived-notify
}
